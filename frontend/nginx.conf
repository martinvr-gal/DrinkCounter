server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Static files are served directly; client-side routes use the SPA entrypoint.
  # A named location avoids a recursive internal redirect if the build is invalid.
  location / {
    try_files $uri $uri/ @spa;
  }

  location @spa {
    try_files /index.html =404;
  }
}
